CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y

# Throttle HID reports for BLE (default 0 reports every IRQ, floods the
# radio queue and feels jumpy). 12ms is badjeff's recommended BLE value.
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

# Fixes the sensor power-up race directly (ext-power VCC not guaranteed
# ready within the driver's default 10ms power-up delay) instead of
# using force-awake, which pins the sensor in RUN mode continuously and
# costs ~3.5mA even when idle. Downshift timing is left at driver
# defaults for battery life.
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
