CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y

# Throttle HID reports for BLE (default 0 reports every IRQ, floods the
# radio queue and feels jumpy). 12ms is badjeff's recommended BLE value.
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

# Don't drop to REST after the 128ms stock idle time - keeps the first
# motion after a pause feeling immediate instead of sluggish.
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=2000
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=3000
CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=30000
